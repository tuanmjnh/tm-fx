# Synthetic ML demo. Not a performance claim and not market history.
experiment_id: demo-phase7-ml
data:
  path: datasets/samples/synthetic_ml_demo.csv   # relative to repo root
  symbol: EURUSD
  timeframe: M5
  timezone: UTC
  data_kind: synthetic
features:
  ema_fast: 5
  ema_slow: 20
  return_windows: [1, 3, 5, 10]
  volatility_window: 10
  volume_window: 10
  stochastic_window: 14
labels:
  horizon: 3          # label uses close[t+3] / close[t] - 1
  min_return: 0.00015 # ambiguous moves inside this dead zone are dropped
splits:
  train_fraction: 0.6
  validation_fraction: 0.2
  initial_train_fraction: 0.5
  folds: 3
model:
  C: 1.0
  max_iter: 1000
  class_weight: null
  seed: 42
execution:
  initial_equity: 10000.0
  position_units: 10000.0
  point_size: 0.00001
  spread_points: 8.0
  slippage_points: 1.0
  commission_per_side: 1.0
outputs:
  report_dir: reports/ml
notes: "Synthetic fixture; classification and strategy metrics are research output only."
